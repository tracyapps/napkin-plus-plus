<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: napkin-thumb:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>napkin++</title>
    <link rel="stylesheet" href="app/styles.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h8" /></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" /></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5" /><path d="m10.5 12.5 8-8M15 8l2.5 2.5M18 5l2 2" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" /><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" /></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z" /><path d="M14 3v5h4M10 12h5M10 16h5" /></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m9 8-5 4 5 4M15 8l5 4-5 4" /></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m7 9 3 3-3 3M13 15h4" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6" /></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z" /><path d="m14 6 4 4" /></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9" /><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" /><circle cx="12" cy="12" r="2.5" /></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16" /><path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.7M6.6 6.7A17 17 0 0 0 2 11s3.5 6 10 6a10.6 10.6 0 0 0 4-.8" /></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z" /></symbol>
      <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1" /><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4" /></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16" /></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 12h9a5 5 0 0 1 0 10h-3" /><path d="M8 7 3 12l5 5" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 8v4l3 2" /></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.4-3.2 7.8-8 9-4.8-1.2-8-4.6-8-9V6z" /><path d="m9 12 2 2 4-4" /></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.4" /><rect x="14" y="3" width="7" height="7" rx="1.4" /><rect x="3" y="14" width="7" height="7" rx="1.4" /><rect x="14" y="14" width="7" height="7" rx="1.4" /></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6" /></symbol>
      <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z" /></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3" /></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M8 3h8l-1 6 3 3v2H6v-2l3-3z" /></symbol>
      <symbol id="i-merge" viewBox="0 0 24 24"><path d="M5 4v3a4 4 0 0 0 4 4h9" /><path d="M5 20v-3a4 4 0 0 1 4-4h9" /><path d="m15 8 3 3-3 3" /></symbol>
      <symbol id="i-capture" viewBox="0 0 24 24"><path d="M4 5h10l6 6v8a1 1 0 0 1-1 1H4z" /><path d="M14 5v6h6M8 14h6M8 17h4" /></symbol>
      <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><path d="M12 11v5M9.5 13.5h5" /></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.6 6.5" /><path d="M20 5v6h-6" /></symbol>
      <symbol id="i-wand" viewBox="0 0 24 24"><path d="M12 3l1.7 4.8L18.5 9.5l-4.8 1.7L12 16l-1.7-4.8L5.5 9.5l4.8-1.7z" /><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z" /></symbol>
      <symbol id="i-message" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" /><path d="M8 9h8M8 12h5" /></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7.5v.5" /></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7 3.7C19 15.6 12 20 12 20z" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="1.6" /><path d="m4 18 5-5 4 4 3-3 4 4" /></symbol>
    </svg>

    <div id="app">
      <div class="window-drag" aria-hidden="true"></div>

      <aside id="sidebar">
        <div class="brand">
          <span class="brand-name">napkin<span class="brand-plus">++</span></span>
          <span class="brand-sub">local dossier</span>
        </div>

        <div class="side-actions">
          <button class="btn primary block" data-action="new-project">
            <svg class="i"><use href="#i-plus" /></svg>
            <span>New project</span>
            <kbd>⌘N</kbd>
          </button>
          <button class="btn block" data-action="capture">
            <svg class="i"><use href="#i-search" /></svg>
            <span>Quick capture</span>
            <kbd data-shortcut>⌥Space</kbd>
          </button>
        </div>

        <nav class="nav" aria-label="Views">
          <button class="nav-row" data-action="view" data-view="all">
            <svg class="i"><use href="#i-grid" /></svg>
            <span>All projects</span>
            <span class="count" data-count="all">0</span>
          </button>
          <button class="nav-row" data-action="view" data-view="recent">
            <svg class="i"><use href="#i-clock" /></svg>
            <span>Recent</span>
            <span class="count" data-count="recent">0</span>
          </button>
          <button class="nav-row" data-action="view" data-view="favorites">
            <svg class="i"><use href="#i-star" /></svg>
            <span>Favorites</span>
            <span class="count" data-count="favorites">0</span>
          </button>
          <button class="nav-row" data-action="view" data-view="archive">
            <svg class="i"><use href="#i-archive" /></svg>
            <span>Archive</span>
            <span class="count" data-count="archive">0</span>
          </button>
        </nav>

        <div class="side-label-row">
          <span class="side-label">Folders</span>
          <button class="mini-btn" data-action="new-folder" title="New folder" aria-label="New folder">
            <svg class="i"><use href="#i-plus" /></svg>
          </button>
        </div>
        <div id="folder-list" class="folder-list"></div>

        <div class="side-label">Tags</div>
        <div id="tag-list" class="tag-list"></div>

        <div class="sidebar-foot">
          <button class="foot-row" data-action="import">
            <svg class="i"><use href="#i-download" /></svg><span>Import notes</span>
          </button>
          <button class="foot-row" data-action="duplicates">
            <svg class="i"><use href="#i-copy" /></svg><span>Find duplicates</span>
          </button>
          <button class="foot-row" data-action="settings">
            <svg class="i"><use href="#i-settings" /></svg><span>Settings</span>
          </button>
          <button class="foot-row" data-action="open-feedback">
            <svg class="i"><use href="#i-message" /></svg><span>Feedback</span>
          </button>
          <button class="foot-row" data-action="shortcuts">
            <svg class="i"><use href="#i-command" /></svg><span>Shortcuts</span>
          </button>
        </div>
      </aside>

      <section id="list-pane" aria-label="Projects">
        <header class="list-head">
          <div class="filter-wrap">
            <svg class="i"><use href="#i-search" /></svg>
            <input id="filter" type="text" placeholder="Filter projects" spellcheck="false" autocomplete="off" />
            <kbd>⌘F</kbd>
          </div>
          <button class="icon-btn" data-action="toggle-grid" title="Grid view (⌘⇧G)" aria-label="Toggle grid view" aria-pressed="false">
            <svg class="i"><use href="#i-grid" /></svg>
          </button>
          <button class="icon-btn" data-action="toggle-sort" title="Sort projects">
            <svg class="i"><use href="#i-sort" /></svg>
          </button>
        </header>
        <div id="list-scope" class="list-scope hidden"></div>
        <div id="project-list" class="project-list"></div>
        <footer class="list-foot">
          <span data-list-count>0 projects</span>
          <span data-sort-label>Recent</span>
        </footer>
      </section>

      <main id="detail" aria-live="polite"></main>
    </div>

    <div id="palette" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Search">
      <div class="palette">
        <div class="palette-input-row">
          <svg class="i"><use href="#i-search" /></svg>
          <input id="palette-input" type="text" placeholder="Search projects, accounts, keys, notes…" spellcheck="false" autocomplete="off" />
          <span class="palette-scope" data-palette-scope>All</span>
        </div>
        <div id="palette-results" class="palette-results"></div>
        <div class="palette-foot">
          <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
          <span><kbd>↵</kbd> open</span>
          <span><kbd>⌘↵</kbd> copy</span>
          <span><kbd>⇥</kbd> filter</span>
          <span><kbd>esc</kbd> close</span>
        </div>
      </div>
    </div>

    <div id="modal" class="overlay hidden" role="dialog" aria-modal="true"></div>
    <div id="ctx-menu" class="ctx hidden" role="menu"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="app/model.js"></script>
    <script src="app/updates.js"></script>
    <script src="app/feedback.js"></script>
    <script src="app/search.js"></script>
    <script src="app/parse.js"></script>
    <script src="app/fold.js"></script>
    <script src="app/dom.js"></script>
    <script src="app/app.js"></script>
  </body>
</html>
