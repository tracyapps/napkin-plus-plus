<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Quick capture — napkin++</title>
    <link rel="stylesheet" href="app/quick.css" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6" /></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z" /><path d="M14 3v5h4M10 12h5M10 16h5" /></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="3.5" /><path d="m10.5 12.5 8-8M15 8l2.5 2.5M18 5l2 2" /></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="m7 9 3 3-3 3M13 15h4" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" /><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" /></symbol>
    </svg>

    <div class="panel">
      <div class="qhead">
        <span class="qmark">n++</span>
        <div class="modes" id="modes">
          <button class="mode active" data-mode="project">Project</button>
          <button class="mode" data-mode="note">Note</button>
          <button class="mode" data-mode="credential">Secret</button>
          <button class="mode" data-mode="env">Env</button>
        </div>
        <div class="target-wrap">
          <span class="target-label">in</span>
          <select id="target" class="target"></select>
        </div>
      </div>

      <textarea
        id="quick-input"
        class="qinput"
        rows="1"
        spellcheck="false"
        autocomplete="off"
        placeholder="lu app — or paste anything"
      ></textarea>

      <div class="detect" id="detect"></div>
      <div class="rows" id="quick-rows"></div>

      <div class="qhint">
        <div><strong>Paste anything.</strong> .env blocks become keys, login lines become accounts, prose becomes a note.</div>
        <div><kbd>⇥</kbd> switches Project, Note, Secret and Env.</div>
      </div>

      <div class="qfoot">
        <span><kbd>↵</kbd> <span id="foot-primary">create</span></span>
        <span><kbd>⇥</kbd> mode</span>
        <span><kbd>↑↓</kbd> move</span>
        <span class="spacer"></span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>

    <script src="app/model.js"></script>
    <script src="app/parse.js"></script>
    <script src="app/dom.js"></script>
    <script src="app/quick.js"></script>
  </body>
</html>
